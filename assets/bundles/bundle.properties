setting.disable-breakpoints.name = Disable breakpoints
setting.disable-breakpoints.description = Disabled breakpoints do not stop code execution.
setting.asserts-are-breakpoints.name = Breakpoint on failed assertions
setting.asserts-are-breakpoints.description = When enabled, a failed assertion triggers a breakpoint.\nWhen breakpoints are disabled, the assertion will be ignored.
setting.free-camera-on-breakpoint.name = Detach camera on breakpoint
setting.free-camera-on-breakpoint.description = When a breakpoint is hit, the camera is temporarily detached to keep the processor centered in the view.
setting.max-instructions.name = Max Instructions
setting.max-instructions.description = Sets the instruction limit in logic processors. An increased limit may be used to add debugging code to your program.
setting.min-wait-time-update.name = Show waits longer than (sec)
setting.min-wait-time-update.description = Sets the minimal wait time specified in the `wait` instruction parameter which causes the wait to be indicated on processors.
setting.processor-updates-per-tick.name = Processors updated per tick
setting.processor-updates-per-tick.description = Sets the number of processors inspected in each tick. Larger values may decrease response time and increase the CPU usage.
setting.warn-effect-frequency.name = Visual warning
setting.warn-effect-frequency.description = Sets the frequency of visual warnings on the map.
