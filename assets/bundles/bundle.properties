setting.mlogdevtools-disable-breakpoints.name = Disable breakpoints
setting.mlogdevtools-disable-breakpoints.description = Disabled breakpoints do not stop code execution.
setting.mlogdevtools-asserts-are-breakpoints.name = Breakpoint on failed assertions
setting.mlogdevtools-asserts-are-breakpoints.description = When enabled, a failed assertion triggers a breakpoint.\nWhen breakpoints are disabled, the assertion will be ignored.
setting.mlogdevtools-free-camera-on-breakpoint.name = Detach camera on breakpoint
setting.mlogdevtools-free-camera-on-breakpoint.description = When a breakpoint is hit, the camera is temporarily detached to keep the processor centered in the view.
setting.mlogdevtools-max-instructions.name = Max Instructions
setting.mlogdevtools-max-instructions.description = Overrides the instruction limit in logic processors. An increased limit may be used to add debugging code to your program.
setting.mlogdevtools-min-wait-time-update.name = Show waits longer than (sec)
setting.mlogdevtools-min-wait-time-update.description = The minimal wait time specified in the [gold]wait[] instruction parameter which causes the wait to be indicated on processors.
setting.mlogdevtools-min-wait-time-update.none = none
setting.mlogdevtools-processor-updates-per-tick.name = Processors updated per tick
setting.mlogdevtools-processor-updates-per-tick.description = The number of processors inspected in each tick. Larger values may decrease response time and increase the CPU usage.
setting.mlogdevtools-warn-effect-frequency.name = Visual warning
setting.mlogdevtools-warn-effect-frequency.description = The frequency of visual warnings on the map.
setting.mlogdevtools-warn-effect-frequency.never = never
setting.mlogdevtools-warn-effect-frequency.once = once
setting.mlogdevtools-warn-effect-frequency.every = every {0} sec
setting.mlogdevtools-triple-tap-speed.name = Triple tap speed
setting.mlogdevtools-triple-tap-speed.description = Triple-tapping a block within this interval opens the Sensors/Vars/Memory screen for the block.
setting.mlogdevtools-triple-tap-speed.disabled = disabled
setting.mlogdevtools-triple-tap-speed.delay = {0} ms
setting.mlogdevtools-snapshot-limit-0.name = Snapshot limit
setting.mlogdevtools-snapshot-limit-0.description = The maximum number of snapshots kept [accent]per block[].\nWarning: large values may cause memory or performance issues.
setting.mlogdevtools-snapshot-limit-0.disabled = Snapshots disabled

setting.mlogdevtools-snapshot-on-breakpoint.name = Take a snapshot on a breakpoint
setting.mlogdevtools-snapshot-on-breakpoint.description = When enabled, a connected snapshot will be automatically created when a breakpoint is triggered.
setting.mlogdevtools-snapshot-on-assertion.name = Take a snapshot on a failed assertion
setting.mlogdevtools-snapshot-on-assertion.description = When enabled, an isolated snapshot will be automatically created when an assertion fails.

setting.mlogdevtools-variable-update-frequency.name = Variable updates
setting.mlogdevtools-variable-update-frequency.description = The frequency of variable updates on the [accent]Vars[]/[accent]Memory[]/[accent]Properties[] screens.
setting.mlogdevtools-variable-update-frequency.everyframe = every frame
setting.mlogdevtools-variable-update-frequency.ticks = every {0} ticks
setting.mlogdevtools-vars-significant-digits.name = Significant digits
setting.mlogdevtools-vars-significant-digits.description = The number of significant digits displayed on the Vars/Memory/Sensors screens.
setting.mlogdevtools-vars-significant-digits.full = full precision
setting.mlogdevtools-vars-alignment-0.name = Alignment
setting.mlogdevtools-vars-alignment-0.description = Alignment of values displayed on the Vars/Memory/Sensors screens.
setting.mlogdevtools-vars-alignment-0.1 = center
setting.mlogdevtools-vars-alignment-0.8 = left
setting.mlogdevtools-vars-alignment-0.16 = right

setting.mlogdevtools-start-profiler-immediatelly.name = Start the profiler immediately
setting.mlogdevtools-start-profiler-immediatelly.description = When enabled, profiling is started immediatelly upon entering the profiler screen.
