setting.disable-breakpoints.name = Disable breakpoints
setting.disable-breakpoints.description = Disabled breakpoints do not stop code execution.
setting.asserts-are-breakpoints.name = Breakpoint on failed assertions
setting.asserts-are-breakpoints.description = When enabled, a failed assertion triggers a breakpoint.\nWhen breakpoints are disabled, the assertion will be ignored.
setting.free-camera-on-breakpoint.name = Detach camera on breakpoint
setting.free-camera-on-breakpoint.description = When a breakpoint is hit, the camera is temporarily detached to keep the processor centered in the view.
setting.max-instructions.name = Max Instructions
setting.max-instructions.description = Overrides the instruction limit in logic processors. An increased limit may be used to add debugging code to your program.
setting.min-wait-time-update.name = Show waits longer than (sec)
setting.min-wait-time-update.description = The minimal wait time specified in the [gold]wait[] instruction parameter which causes the wait to be indicated on processors.
setting.min-wait-time-update.none = none
setting.processor-updates-per-tick.name = Processors updated per tick
setting.processor-updates-per-tick.description = The number of processors inspected in each tick. Larger values may decrease response time and increase the CPU usage.
setting.warn-effect-frequency.name = Visual warning
setting.warn-effect-frequency.description = The frequency of visual warnings on the map.
setting.warn-effect-frequency.never = never
setting.warn-effect-frequency.once = once
setting.warn-effect-frequency.every = every {0} sec
setting.triple-tap-speed.name = Triple tap speed
setting.triple-tap-speed.description = Triple-tapping a block within this interval opens the Sensors/Vars/Memory screen for the block.
setting.triple-tap-speed.disabled = disabled
setting.triple-tap-speed.delay = {0} ms
setting.snapshot-limit.name = Snapshot limit
setting.snapshot-limit.description = The maximum number of snapshots kept [accent]per block[].\nWarning: large values may cause memory or performance issues.
setting.snapshot-limit.disabled = Snapshots disabled

setting.snapshot-on-breakpoint.name = Take a snapshot on a breakpoint
setting.snapshot-on-breakpoint.description = When enabled, a connected snapshot will be automatically created when a breakpoint is triggered.
setting.snapshot-on-assertion.name = Take a snapshot on a failed assertion
setting.snapshot-on-assertion.description = When enabled, an isolated snapshot will be automatically created when an assertion fails.

setting.variable-update-frequency.name = Variable updates
setting.variable-update-frequency.description = The frequency of variable updates on the [accent]Vars[]/[accent]Memory[]/[accent]Properties[] screens.
setting.variable-update-frequency.everyframe = every frame
setting.variable-update-frequency.ticks = every {0} ticks
setting.vars-significant-digits.name = Significant digits
setting.vars-significant-digits.description = The number of significant digits displayed on the Vars/Memory/Sensors screens.
setting.vars-significant-digits.full = full precision
setting.vars-alignment.name = Alignment
setting.vars-alignment.description = Alignment of values displayed on the Vars/Memory/Sensors screens.
setting.vars-alignment.1 = center
setting.vars-alignment.8 = left
setting.vars-alignment.16 = right
