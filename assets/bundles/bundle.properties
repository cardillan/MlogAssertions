lcategory.asserts = Runtime checks
lcategory.asserts.description = Instructions for verifying invariants using assertions

lst.assertbounds = Halt execution of this processor when a complex assertion is not met.
lst.assertequals = Halt execution of this processor when a variable doesn't match the expected value.
lst.asserttype = Halt execution of this processor when a variable isn't of the expected type.
lst.assertflush = Prepare this processor for executing the [accent]assertprints[] instruction.
lst.assertprints = Halt execution of this processor when the text buffer content doesn't match the expected value.
lst.error = Display the error message and halt execution of this processor.
lst.log = Write a message into the game's log file with the specified level.
lst.breakpoint = Pause the execution of this processor and the game when a condition is met.

